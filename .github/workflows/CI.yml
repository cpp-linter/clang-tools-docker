name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile*'
      - 'docker-bake.hcl'
      - '.github/workflows/CI.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile*'
      - 'docker-bake.hcl'
      - '.github/workflows/CI.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint once, in a job without registry or OIDC permissions.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: make install-deps && make lint

  extract-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jq is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: Get targets from bake file
        id: get-targets
        run: |
          TARGETS=$(docker buildx bake --file docker-bake.hcl --print | jq -c '[.target | keys[] | select(. != "default")]')
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, extract-targets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for cosign keyless signing
      packages: write
    strategy:
      matrix:
        target: ${{ fromJson(needs.extract-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check buildx bake
        run: docker buildx bake --file docker-bake.hcl --print

      - name: Build image for tag ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: docker buildx bake --file docker-bake.hcl "$TARGET"

      - name: Login container registries
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          printf '%s\n' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Publish image for tag ${{ matrix.target }} (with SBOM + provenance)
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker buildx bake --file docker-bake.hcl "$TARGET" --push \
            --set "*.attest=type=sbom" \
            --set "*.attest=type=provenance,mode=max" \
            --metadata-file "$RUNNER_TEMP/bake-metadata.json"
          # Both registries receive the same image index, so one digest covers both tags.
          DIGEST=$(jq -r --arg target "$TARGET" '.[$target]["containerimage.digest"] // empty' "$RUNNER_TEMP/bake-metadata.json")
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::No pushed image digest found for target $TARGET"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the digest that was just pushed, not the tag, so the signature cannot
      # land on a different image if the tag moves in between.
      - name: Sign images with cosign (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/cpp-linter/clang-tools@$DIGEST"
          cosign sign --yes "xianpengshen/clang-tools@$DIGEST"

      - name: Remove builder instances
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        run: docker buildx rm --all-inactive --force
