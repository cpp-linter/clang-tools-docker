name: Docker Scout

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker-bake.hcl'
      - '.github/workflows/docker-scout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker-bake.hcl'
      - '.github/workflows/docker-scout.yml'

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # docker/scout-action posts the CVE summary on pull requests
      security-events: write  # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build target 22 from docker-bake.hcl, so the scan uses the same pins as CI.
      - name: Build image
        run: >-
          docker buildx bake --file docker-bake.hcl 22
          --set 22.platform=linux/amd64
          --set 22.output=type=docker
          --set 22.tags=xianpengshen/clang-tools:22

      - name: Login to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout CVEs
        if: github.actor != 'dependabot[bot]'
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: xianpengshen/clang-tools:22
          sarif-file: scout.sarif
          only-severities: critical,high

      - name: Upload SARIF to GitHub Code Scanning
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scout.sarif
