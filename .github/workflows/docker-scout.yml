name: Docker Scout

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - '.github/workflows/docker-scout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - '.github/workflows/docker-scout.yml'

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # docker/scout-action posts the CVE summary on pull requests
      security-events: write  # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          build-args: |
            BASE_IMAGE=ubuntu:questing
            CLANG_VERSION=21
          load: true
          tags: xianpengshen/clang-tools:21

      - name: Login to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout CVEs
        if: github.actor != 'dependabot[bot]'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: xianpengshen/clang-tools:21
          sarif-file: scout.sarif
          only-severities: critical,high

      - name: Upload SARIF to GitHub Code Scanning
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scout.sarif
