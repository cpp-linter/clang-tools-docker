name: Docker Scout

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - '.github/workflows/docker-scout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - '.github/workflows/docker-scout.yml'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: Dockerfile
          build-args: |
            BASE_IMAGE=ubuntu:questing
            CLANG_VERSION=21
          load: true
          tags: xianpengshen/clang-tools:21

      - name: Login to Docker Hub
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout CVEs
        if: github.actor != 'dependabot[bot]'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: xianpengshen/clang-tools:21
          sarif-file: scout.sarif
          only-severities: critical,high

      - name: Upload SARIF to GitHub Code Scanning
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: scout.sarif
