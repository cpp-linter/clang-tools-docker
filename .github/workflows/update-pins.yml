name: Update pins

on:
  schedule:
    # Daily check for new static-binaries releases
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      # push the update branch and open the pull request
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the newest releases from index.json
        run: python3 scripts/update-pins.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "build: bump the clang-tools images to the newest static binaries"
          branch: auto-update-pins
          delete-branch: true
          title: "build: bump the clang-tools images to the newest static binaries"
          body: |
            Automated update from the
            [clang-tools-static-binaries index](https://cpp-linter.github.io/clang-tools-static-binaries/),
            which lists the newest release of every LLVM version.

            - `docker-bake.hcl` and the list of tags in `README.md` name the newest release of each version.
            - A new LLVM version gets its own image, on the base image of the version before it, and the `latest` tag.

            GitHub does not start CI on a pull request that a workflow opened. Close and reopen
            this pull request to build the images before merging.
          labels: |
            automated
          assignees: |
            ${{ github.actor }}
